<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keith Walsh — Analytics Engineer</title>
    <meta
      name="description"
      content="Analytics engineer in Ireland. Tested dbt models, SQL and Python, dashboards, and an MCP server giving AI read-only ERP access, plus free in-browser dev tools."
    />
    <link rel="canonical" href="https://www.keithwalsh.ie/" />

    <!-- Link previews. Social crawlers do not run JavaScript, so these have to
         be static: the per-route <title> is set by the router at runtime. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Keith Walsh" />
    <meta property="og:title" content="Keith Walsh — Analytics Engineer" />
    <meta
      property="og:description"
      content="Analytics engineer in Ireland. Tested dbt models, SQL and Python, dashboards, and an MCP server giving AI read-only ERP access, plus free in-browser dev tools."
    />
    <meta property="og:url" content="https://www.keithwalsh.ie/" />
    <meta property="og:image" content="https://www.keithwalsh.ie/photo.jpg" />
    <meta property="og:image:alt" content="Keith Walsh" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash.
      try {
        var theme = localStorage.getItem("theme")
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches
        var isDark =
          theme === "dark" ||
          ((theme === null || theme === "system") && prefersDark)
        document.documentElement.classList.add(isDark ? "dark" : "light")
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
